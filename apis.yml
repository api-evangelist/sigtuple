name: SigTuple
description: 'SigTuple Technologies is a medical-technology company that combines artificial
  intelligence, robotics, microfluidics and high-resolution digital microscopy to automate
  the microscopic analysis of biological samples across human and veterinary diagnostics.
  Its product portfolio includes AS76, a CE-IVDR compliant automated digital cell morphology
  analyzer for peripheral blood smears with true 100X oil immersion; AI100, an FDA- and
  CE-cleared multi-purpose analyzer for blood smear and urine sediment analysis; and SigVet,
  an AI point-of-care platform for veterinary clinics. Backed by Accel, the company reports
  10+ years of R&D, 27 patents and 350+ deployments globally. As of this enrichment pass
  SigTuple publishes no public developer/API surface (no docs portal, OpenAPI, /.well-known
  discovery, or llms.txt were found); this profile captures identity plus a probed domain-security
  posture.'
